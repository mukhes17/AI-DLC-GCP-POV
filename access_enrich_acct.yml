version: 2

models:
  - name: access_enrich_acct
    description: "Enriched table containing customer access information with derived attributes."

    tests:
      - unit:
          name: test_suspicious_access_logic
          description: "Verify that the suspicious_access flag is correctly set based on login_count."
          
          given:
            - input: ref('int_cap_sat')
              rows:
                # Case 1: login_count is exactly 10, should NOT be suspicious
                - { login_count: 10, balance: 0, segment_code: 'Retail' }
                # Case 2: login_count is greater than 10, SHOULD be suspicious
                - { login_count: 11, balance: 0, segment_code: 'Retail' }
                # Case 3: login_count is less than 10, should NOT be suspicious
                - { login_count: 9, balance: 0, segment_code: 'Retail' }
                # Case 4: login_count is a high number, SHOULD be suspicious
                - { login_count: 100, balance: 0, segment_code: 'Retail' }

          expect:
            rows:
              # Expected result for Case 1
              - { suspicious_access: false }
              # Expected result for Case 2
              - { suspicious_access: true }
              # Expected result for Case 3
              - { suspicious_access: false }
              # Expected result for Case 4
              - { suspicious_access: true }

      - unit:
          name: test_high_value_customer_logic
          description: "Verify that the high_value_customer flag is correctly set based on balance and segment."

          given:
            - input: ref('int_cap_sat')
              rows:
                # Case 1: Meets both conditions -> SHOULD be high value
                - { balance: 100001, segment_code: 'HNI', login_count: 1 }
                # Case 2: Balance is too low -> should NOT be high value
                - { balance: 99999, segment_code: 'HNI', login_count: 1 }
                # Case 3: Segment is wrong -> should NOT be high value
                - { balance: 100001, segment_code: 'Retail', login_count: 1 }
                # Case 4: Balance is exactly the threshold -> should NOT be high value
                - { balance: 100000, segment_code: 'HNI', login_count: 1 }
                # Case 5: Neither condition is met -> should NOT be high value
                - { balance: 50000, segment_code: 'Retail', login_count: 1 }

          expect:
            rows:
              # Expected result for Case 1
              - { high_value_customer: true }
              # Expected result for Case 2
              - { high_value_customer: false }
              # Expected result for Case 3
              - { high_value_customer: false }
              # Expected result for Case 4
              - { high_value_customer: false }
              # Expected result for Case 5
              - { high_value_customer: false }