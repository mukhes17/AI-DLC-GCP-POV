version: 2

models:
  - name: access_enrich_customer
    description: "Enriched customer information, combining customer, address, and contact details."
    columns:
      - name: CUST_ID
        description: "The unique identifier for the customer."
        tests:
          - unique
          - not_null
      - name: CUST_NAME
        description: "The full name of the customer."
        tests:
          - not_null
      - name: EMAIL
        description: "The email address of the customer."
        tests:
          - not_null
      - name: COUNTRY
        description: "The country of the customer's address."
        tests:
          - not_null
      - name: LOAD_DATE
        description: "The date the record was loaded."
        tests:
          - not_null

    unit_tests:
      - name: test_basic_customer_join
        description: "Tests the basic join logic between customer and address information."
        given:
          - input: ref('int_cust_sat')
            rows:
              - {CUST_ID: 'cust_1', FULL_NAME: 'John Doe', CUST_TYPE: 'Retail', EMAIL_ADDR: 'john.doe@example.com', PHONE_NUM: '123-456-7890', SRC_EFF_FROM_DTTM: '2023-01-01T00:00:00Z', SRC_EFF_TO_DTTM: '2023-12-31T23:59:59Z', RDH_EFF_FROM_DTTM: '2023-01-01T00:00:00Z', RDH_EFF_TO_DTTM: '2023-12-31T23:59:59Z', SRC_COUNTRY: 'US', RDH_LOAD_DTTM: '2023-01-15T10:00:00Z'}
          - input: ref('int_cust_addr_lsat')
            rows:
              - {CUST_ID: 'cust_1', ADDR_ID: 'addr_101', ADDR_TYPE: 'Primary', IS_PRIMARY: true, EFFECTIVE_DATE: '2023-01-01', END_DATE: '2023-12-31'}
          - input: ref('int_addr_sat')
            rows:
              - {ADDR_ID: 'addr_101', STREET_NAME: '123 Main St', CITY_NAME: 'Anytown', STATE_CODE: 'CA', POSTAL_CODE: '12345', COUNTRY_NAME: 'USA'}
        expect:
          rows:
            - {CUST_ID: 'cust_1', CUST_NAME: 'John Doe', EMAIL: 'john.doe@example.com', COUNTRY: 'USA', RECORD_SOURCE: 'ACCESS_ENRICH_CUST'}

      - name: test_multiple_addresses
        description: "Tests that a customer with multiple addresses produces multiple rows."
        given:
          - input: ref('int_cust_sat')
            rows:
              - {CUST_ID: 'cust_2', FULL_NAME: 'Jane Smith', CUST_TYPE: 'Retail', EMAIL_ADDR: 'jane.smith@example.com', PHONE_NUM: '987-654-3210', SRC_EFF_FROM_DTTM: '2023-01-01T00:00:00Z', SRC_EFF_TO_DTTM: '2023-12-31T23:59:59Z', RDH_EFF_FROM_DTTM: '2023-01-01T00:00:00Z', RDH_EFF_TO_DTTM: '2023-12-31T23:59:59Z', SRC_COUNTRY: 'US', RDH_LOAD_DTTM: '2023-01-15T11:00:00Z'}
          - input: ref('int_cust_addr_lsat')
            rows:
              - {CUST_ID: 'cust_2', ADDR_ID: 'addr_201', ADDR_TYPE: 'Primary', IS_PRIMARY: true, EFFECTIVE_DATE: '2023-01-01', END_DATE: '2023-12-31'}
              - {CUST_ID: 'cust_2', ADDR_ID: 'addr_202', ADDR_TYPE: 'Secondary', IS_PRIMARY: false, EFFECTIVE_DATE: '2023-05-01', END_DATE: '2023-12-31'}
          - input: ref('int_addr_sat')
            rows:
              - {ADDR_ID: 'addr_201', STREET_NAME: '456 Oak Ave', CITY_NAME: 'Someplace', STATE_CODE: 'NY', POSTAL_CODE: '54321', COUNTRY_NAME: 'USA'}
              - {ADDR_ID: 'addr_202', STREET_NAME: '789 Pine Ln', CITY_NAME: 'Otherville', STATE_CODE: 'FL', POSTAL_CODE: '67890', COUNTRY_NAME: 'USA'}
        expect:
          rows:
            - {CUST_ID: 'cust_2', ADDR_ID: 'addr_201', STREET: '456 Oak Ave'}
            - {CUST_ID: 'cust_2', ADDR_ID: 'addr_202', STREET: '789 Pine Ln'}

      - name: test_missing_address
        description: "Tests that a customer with no address information is not included in the output."
        given:
          - input: ref('int_cust_sat')
            rows:
              - {CUST_ID: 'cust_3', FULL_NAME: 'No Address', CUST_TYPE: 'Retail', EMAIL_ADDR: 'no.address@example.com', PHONE_NUM: '555-555-5555', SRC_EFF_FROM_DTTM: '2023-01-01T00:00:00Z', SRC_EFF_TO_DTTM: '2023-12-31T23:59:59Z', RDH_EFF_FROM_DTTM: '2023-01-01T00:00:00Z', RDH_EFF_TO_DTTM: '2023-12-31T23:59:59Z', SRC_COUNTRY: 'US', RDH_LOAD_DTTM: '2023-01-15T12:00:00Z'}
          - input: ref('int_cust_addr_lsat')
            rows:
              - {CUST_ID: 'cust_3', ADDR_ID: 'addr_301', ADDR_TYPE: 'Primary', IS_PRIMARY: true, EFFECTIVE_DATE: '2023-01-01', END_DATE: '2023-12-31'}
          - input: ref('int_addr_sat')
            rows:
              []
        expect:
          rows:
            []